# UniXNU board description for the nubia RedMagic 9 series (NX769J, SM8650).
#
# NX769J covers RedMagic 9 Pro / 9 Pro+ and RedMagic 9S Pro / 9S Pro+, the ZTE
# nubia gaming phones built on Qualcomm "pineapple" (Snapdragon 8 Gen 3).
#
# Hardware values are taken from public NX769J sources and from the mainline
# SM8650 SoC description. See porting.toml for the source of each value and for
# the inputs that still require a measurement on the device.
#
#   SoC register map and CPU topology : u-boot/u-boot dts/upstream/src/arm64/qcom/sm8650.dtsi
#   Board identity and boot format    : Klozz/nubia_nx769j_dump, Ling0925/android_device_nubia_NX769J
#   Touch and peripheral firmware     : DarkestSpawn/device_NX769J

schema_version = 2

[board]
name = "nx769j"
soc = "SM8650"
# There is no UniXNU-sm8650-common yet. sm8550-common is pinned because its SoC
# register map matches SM8650 for every resource this port uses: GIC distributor
# 0x17100000 and redistributors 0x17180000, UFS host 0x1d84000/0x3000, UFS PHY
# 0x1d80000/0x2000, GPU 0x3d00000, GMU 0x3d6a000 and GPU SMMU 0x3da0000. The CPU
# compatible strings and the Adreno generation do differ and are overridden in
# dts/nx769j.dts and configs/nx769j_defconfig.
soc_source = "sm8550"
# iOS 16.5 (build 20F66), Darwin 22.5.0, XNU 8796. The profile lives in this
# repository at os-profiles/ios-16.5-20F66/ until it is contributed to
# UniXNU/profiles/os/. This is a phone target: the ADT forges an iPhone X
# identity, not the iPad identity the shipped UniXNU profile uses.
os_profile = "ios-16.5-20F66"
description = "nubia RedMagic 9 Pro / 9 Pro+ / 9S Pro / 9S Pro+ (NX769J)"
kit = "nx769j"

[components]
# Arrays replace the inherited arrays from the ARM64, SoC and OS profiles, so
# this list is the complete selection. Deliberately omitted:
#   Adreno740, AdrenoMetal, Sm8550Platform, AdrenoPM4, AdrenoFirmware,
#   ArmSmmu4K  - the catalog GPU stack targets Adreno 740 on SM8550. NX769J has
#                Adreno 750 ("qcom,adreno-43051401", "qcom,adreno-gmu-750.1").
#   ShengHidInput, ShengNovatekTouch, QcomGeniSpi - the touch driver is for the
#                Novatek NT36532E. NX769J uses a Goodix 9916R.
#   Ath12kWifi   - declares os_abi "nw_abi platform interface", which does not
#                match ipados-17.7.11-21H461.
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "XnuPrelink",
  "DarwinBoot",
  "ShengUfs",
  "VirtioMmioBlock",
  "VerifiedRoot",
  "GopFramebuffer",
]

[kernel]
defconfig = "nx769j_defconfig"
# Archive builders run in order before the kernel link. component:<ID> runs the
# component's own build entry from the catalog.
#
# build-mockfs-fixture.py is deliberately absent. It compiles an offline test
# fixture, and the kernel only force-loads it when MOCKFS_MODE is 1
# (build-xnu-4k-baseline.sh reads MOCKFS_MODE from XNU_SOURCE_MOCKFS). This
# board leaves CONFIG_XNU_SOURCE_MOCKFS unset, so the archive is never a link
# input and building it only adds a stage that can fail. Add it back, and turn
# CONFIG_XNU_SOURCE_MOCKFS on, together.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "component:VirtioMmioBlock",
  "build-virtio-mmio-bindings.py --component VirtioMmioBlock",
]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ios.config"]
# The rebased patch series lives in this repository and is applied on its own.
# The shared arch, soc and os series still target xnu-10063.141.1, so
# referencing them here would abort `unixnu status` with "patch missing" or fail
# during patch application. patches/xnu/series holds the whole resolved order,
# rebased onto xnu-8796 and verified to apply strictly in sequence, plus the two
# prelink patches XnuPrelink ships only for xnu-10063.
#
# Switch back to
#   ["arch:patches/xnu/series", "soc:patches/xnu/series",
#    "os:patches/xnu/series", "device:patches/xnu/series"]
# once the shared series are rebased, and delete the duplicated copies here.
patch_series = ["device:patches/xnu/series"]

# kernel.prelink is inherited from profiles/os/ipados-17.7.11-21H461/profile.toml:
# tool, kernel path, kernelcache_sha256, slide, early_security_init and roots.
# Only board-specific overrides belong here. Note that the caihong SM8650 port
# reports "AMFI: No PMGR?" panics from early_security_init on a SoC without an
# Apple PMGR block; see the packaging area of porting.toml before enabling it.

# [ipsw] and [kernel.prelink] are inherited from the selected OS profile
# (os-profiles/ios-16.5-20F66/profile.toml). Tables merge by key, so a board
# that needs to override one field can declare just that field here.
#
# The restored image is an iOS 16.5 (20F66) iPhone X restore image. The ADT
# forges that identity onto this board, so the IPSW model does not describe the
# phone. Several fields in the profile are marked REQUIRED_IPSW: they are read
# out of the restore image and cannot be filled without it. Keeping [ipsw] in
# one place means those values are edited in one file, not two.

[userdata]
# Measured on the device with `sgdisk --print /dev/block/sda`; see
# device-inputs.md. userdata is /dev/block/sda12 and ends on the last usable
# sector, so it is the last occupied partition and no unixnu partition exists
# yet. The GPT holds 32 entries and uses 12.
#
# Writing the OS windows into these extents overwrites Android's /data. To keep
# the stock system bootable, carve a separate unixnu partition first; see
# README.md and https://unixnu.com/porting/dual-system-partition.
first_lba = 3302184
last_lba = 124002298
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# payload.adt.root_match_volume_uuid is the one board input still open: it is
# the APFS volume UUID inside the OS window, which only exists once the iPadOS
# image is installed. Read it from that volume and set it here.

[firmware]
# Produced by the uefi-nx769j Mu-Silicium platform package.
config = "nx769j"
dsc = "Platforms/Nubia/nx769jPkg/nx769j.dsc"
fd = "Build/nx769jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "nx769j"

# The NX769J board configuration records BOARD_BOOTIMG_HEADER_VERSION := 4, but
# that is the Android build system's setting for building a stock boot.img, not
# what unixnu can pack and verify. scripts/unixnu/bootimg.py verify() unpacks
# ten u32 words from offset 8 and compares header_version and pagesize at the
# v0/v1/v2 offsets; a v4 header has those fields elsewhere, so the round-trip
# check fails with "boot image header does not match the requested parameters".
# The tool's own DEFAULTS use header_version 0.
#
# The sibling RedMagic port UniXNU-nx729j hit exactly this and fixed it the same
# way, then fastboot-booted the image on hardware. If the NX769J ABL turns out
# to reject a v0 image, the answer is to extend verify() for v4 rather than to
# set the value here.
[bootimg.image]
base = 0x0
pagesize = 4096
header_version = 0

# The stock bootloader keeps the contiguous-splash region and expects it in the
# boot image's device tree. Measured on the device from
# /proc/device-tree/reserved-memory/splash_region; see device-inputs.md. The
# node name and the cont_splash_region label follow the same convention as
# UniXNU-sheng, and the region size 0x2b00000 matches sheng and shennong.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

[payload]
volume = "NX769JESP"
size_mib = 208
loader = "firmware"
title = "UniXNU"
# Handoff window passed to the ADT tool, not the installed DRAM size.
dram_size = "0x80000000"
panic_screen = true
timeout = 3
kernel_args = ["-v", "serial=3"]

[payload.adt]
chip_id = "207"
owned_memory_size = "0x80000000"
# The APFS volume UUID inside the OS window. The UFS block class publishes the
# window, the partition scheme publishes the volume and XNU matches it. Read it
# from the installed OS image before the first boot:
#   diskutil info <the OS window's APFS volume> | grep "Volume UUID"
root_match_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID"
cpu_regs = "0"
psci_method = "smc"
packed_data_ramdisk = true
# This is a phone target, so the iPhone identity from the OS profile applies.
# The iPadOS 17.7.11 profile sets ipad_identity because it forges an iPad; the
# iOS 16.5 profile forges iPhone X (iPhone10,3 / D22AP) instead.
ipad_identity = false
unique_chip_id = "required"

[device_tree]
source = "device:dts/nx769j.dts"
include_dirs = ["soc:dts"]
