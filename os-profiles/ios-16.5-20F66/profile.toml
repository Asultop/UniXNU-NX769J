# iOS 16.5 OS profile for UniXNU.
#
# Target: iOS 16.5 (build 20F66), Darwin 22.5.0, XNU 8796.
# Identity: iPhone X (iPhone10,3 / D22AP).
#
# This profile belongs at UniXNU/profiles/os/ios-16.5-20F66/. It is kept in the
# device repository until it is contributed to UniXNU; the Build workflow
# installs it into the UniXNU checkout before resolving. See README.md.
#
# XNU 8796 is the iOS 16 kernel. The open-source releases of the 8796 train are
# xnu-8796.101.5, xnu-8796.121.2 and xnu-8796.141.3; xnu-8796.101.5 is the
# earliest and is the closest drop to Darwin 22.5.0, so it is the baseline here.
# The community iOS 16 ports (dipa-studio/ios-sweet and the ios-topaz family)
# build the same train.
#
# The IPSW-derived values below were read out of
# iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw with
# scripts/extract-ipsw-pins.py, which reproduces every one of them. The kexts
# carry CFBundleVersion 22.5.0, which independently confirms the Darwin version.

["os"]
"name" = "ios-16.5-20F66"
"darwin" = "22.5.0"
"xnu_version" = "8796.101.5"
"xnu_revision" = "aca3beaa3dfbd42498b42c5e5ce20a938e6554e5"
"driverkit_tag" = "xnu-8796.101.5"
"trustcache_tag" = "xnu-8796.101.5"
"abi" = ["IOGPUFamily", "IOHIDFamily-2031.120.4", "IOMobileGraphicsFamily"]


["ipsw"]
# The restore image is not redistributable. The value is the member name so the
# entry is self-identifying; point the build at a local copy with --ipsw or
# UNIXNU_IPSW. Apple names the file
# iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw.
"url" = "iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
"product" = "iPhone10,3"
"version" = "16.5"
"build" = "20F66"
"device_class" = "d22ap"
# BuildManifest BuildIdentities for d22ap: ApChipID 0x8015, ApBoardID 0x06.
# Restore.plist DeviceMap agrees: BDID 6, BoardConfig d22ap, CPID 32789,
# Platform t8015, SDOM 1. d221ap (iPhone10,6) uses ApBoardID 0x0E instead.
"chip_id" = 32789
"board_id" = 6
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

["ipsw"."sha256"]
# Member hashes pinned by member file name. These are the two disk images the
# [userdata] windows consume: OS and Cryptex1,SystemOS. unixnu ipsw fetch
# checks every extracted member against its pin.
"096-04088-077.dmg" = "64354ba3475d3c34d6fc531f75585a7b24af0fdb7a3a8a2bdf95c7f351a3f290"
"096-04666-078.dmg" = "2279bf443856fcb6a3f00b1fa06a32ba02a66fdf6ab6b12019462c7498aafdd3"


["kernel"]

["kernel"."prelink"]
"tool" = "kits/XnuPrelink/emit_prelink.py"
"kernel" = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# sha256 of the decompressed arm64 kernelcache Mach-O, which is what
# scripts/unixnu/ipsw.py writes to kernelcache.decompressed. The pipeline is
# IMG4 payload -> LZFSE decode -> the single 0x0100000c fat slice, and the pin
# covers that slice only. Hashing the whole fat image gives a different digest
# and would fail the pin check.
"kernelcache_sha256" = "e6fa75598f47b5a9460a60913e2ac8e4cd6cd60eb475bb31da65b68ffbcfdad5"
"slide" = "-0x1000000"
# The slid load address of AppleMobileFileIntegrity's early security init in
# this kernelcache, read from the __PRELINK_INFO dictionary. The iPadOS 17.7.11
# profile carries 0xfffffff005ab4ae0 for its own kernelcache; the addresses are
# version bound and must not be copied between profiles. Leave the hook unset to
# skip the path entirely, which is what the caihong SM8650 port does on a SoC
# without an Apple PMGR.
"early_security_init" = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff004e2b640"
# Bundle identifiers kept from this kernelcache. Every entry below is present in
# the iOS 16.5 kernelcache's __PRELINK_INFO. The iPadOS 17.7.11 list also keeps
# com.apple.iokit.IOHIDEventDriver, which this kernelcache does not contain.
"roots" = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]


["payload"]
# REQUIRED: fixups of signed text, carried in /chosen/text-fixups by
# patches/xnu/native-text-fixup.patch. The format is
#   name,hex,hex-bytes,hex-bytes   (see scripts/unixnu/payload.py)
# for example dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9
# They are derived from the dyld shared cache inside the OS image, so they
# cannot be read from the IPSW container alone. The placeholder is left in place
# so the payload step fails loudly instead of silently omitting the fixups.
"text_fixups" = ["REQUIRED_TEXT_FIXUP_name_hex_bytes_bytes"]
# Trust cache bundle hashes this board accepts, checked against the file passed
# with --trust-cache. These are the two trust caches shipped in the IPSW.
"trust_cache_sha256" = [
  "df0f60fd05b7c312ad0fddb5c85d8adf97b487e8500518337bc4cbde3ca73ea7",
  "501fa23c4620e68e48b91bd2ba8d74251d4fbe37147290650cf717bbef619616",
]


["adt"]

["adt"."root"]

["adt"."root"."string"]
"model" = "iPhone10,3"
"target-type" = "D22"
# The board name first: the audio server keys its routing database and
# MediaExperience its per-board tables on it.
"compatible" = "D22AP"


["adt"."chosen"]

["adt"."chosen"."string"]
"osenvironment" = "main"
"crypto-hash-method" = "sha2-384"


["adt"."chosen"."u32"]
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1


["adt"."product"]

["adt"."product"."string"]
"product-name" = "iPhone X"
"product-description" = "iPhone X"
# A phone, not a pad: the iPadOS profile sets artwork-device-idiom to pad and
# that drives the layout of every userland surface.
"artwork-device-idiom" = "phone"
"artwork-display-gamut" = "P3"
"compatible-device-fallback" = "iPhone10,6"


["adt"."product"."u32"]
"artwork-device-subtype" = 1773
"artwork-scale-factor" = 3

# MGGetProductType() looks this 20-byte id up in libMobileGestalt's product
# table; without it every client that switches on the product type sees an
# unknown device. REQUIRED: the id for iPhone10,3, read from libMobileGestalt
# inside the OS image. The iPadOS profile carries
# e9fefef6e6f9d12a5ba1a2551866cbbd749f0ec3 for J120; that value belongs to a
# different product and must not be reused here.
["adt"."product"."bytes"]
"product-id" = "REQUIRED_PRODUCT_ID_20_BYTES"


["adt"."defaults"]

["adt"."defaults"."u32"]
"kern.maxvnodes" = 66560
