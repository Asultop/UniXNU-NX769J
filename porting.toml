schema_version = 1

[device]
name = "nx769j"
soc = "SM8650"
os_profile = "ipados-17.7.11-21H461"
summary = "nubia RedMagic 9 Pro / 9 Pro+ / 9S Pro / 9S Pro+ (NX769J) on Qualcomm SM8650. The board shares the SM8550 SoC register map and owns its CPU topology, UFS root policy, Goodix touch input and Adreno 750 GPU work. This record states the implementation coverage of each area and the evidence each milestone requires."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "SoftwareAES", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example"]
inputs = ["SM8650 register map and CPU topology from mainline sm8650.dtsi.", "iPadOS 17.7.11 build 21H461 OS profile with XNU 10063.141.1.", "UniXNU-sm8550-common revision 23b2049fcd9e30356161def84231334fb55ecca9 as the SoC source.", "Board identity from the NX769J Android 14 vendor firmware and board configuration."]
configuration = ["board.name = nx769j; board.soc = SM8650; board.soc_source = sm8550; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "components.include lists the complete selection; arrays replace the inherited ARM64, SoC and OS arrays.", "kernel.defconfig = nx769j_defconfig; config_fragments apply arch, soc, os in order and the device defconfig last.", "device_tree.source = device:dts/nx769j.dts with include_dirs = [soc:dts].", "Board submodules are not used; every driver comes from the component catalog at its pinned revision."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig nx769j_defconfig -D ../UniXNU-NX769J from the UniXNU checkout.", "Run ./unixnu fetch -D ../UniXNU-NX769J and commit the resulting unixnu.lock.", "Run ./unixnu status --json -D ../UniXNU-NX769J and review the resolved profiles, components, source pins and patch order, then ./unixnu tree -D ../UniXNU-NX769J."]
findings = ["Tables merge in ARM64, SoC, OS, device order and arrays replace inherited arrays, so the device must list every required component and fragment.", "soc:configs/sm8550.config sets CONFIG_XNU_NATIVE_ADRENO=y. The device defconfig applies last and sets CONFIG_XNU_NATIVE_ADRENO=n because the SM8550 GPU stack targets Adreno 740 while this board has Adreno 750.", "There is no UniXNU-sm8650-common. sm8550-common is usable as the SoC source because the register map of every resource this port drives is identical on both parts: GICD 0x17100000/0x10000, GICR 0x17180000/0x200000, UFS host 0x01d84000/0x3000, UFS PHY 0x01d80000/0x2000, GPU 0x03d00000/0x40000, GMU 0x03d6a000/0x35000 and GPU SMMU 0x03da0000/0x40000. The CPU core names and the Adreno generation do differ and are overridden in the board DTS and defconfig.", "The kernel.prelink block is inherited from the OS profile rather than duplicated, so the board only records the values it actually overrides.", "unixnu status resolves the complete ordered patch series, so it needs the source of every component named by a component: entry. The OS profile series names XnuPrelink twice and status aborts with 'patch missing' when that source is absent, while defconfig alone succeeds because it only reads the configuration fragments. The resolve build test therefore runs fetch and tree before status, which is the step 4 order in the porting guide.", "unixnu fetch records component sources in unixnu.lock as well as feed sources when the device repository declares no git submodules. UniXNU-sheng pins its board drivers as submodules and its lock carries feed sources only; this repository carries both, and every component revision in the lock matches its pin in the component catalog.", "unixnu.lock is machine written: fetch rewrites it with a single header comment and drops any comment added by hand. Keep explanations out of the lock and record them here, so the file stays byte-identical to what fetch produces.", "A change under .github/** or unixnu.lock is owned by this area, so a workflow or lock change has to land with a matching finding or evidence entry here to satisfy the record checker's changed-area rule."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["local.toml can select a different source from the published pin; record the effective source in each verification result.", "The SoC source is the SM8550 repository. A dedicated UniXNU-sm8650-common would carry the SM8650 CPU topology and Adreno 750 platform operations instead of board-level overrides."]
next_action = ["Compare the effective status output whenever a profile, source or component selection changes.", "Extract the SM8650 CPU topology and platform operations into UniXNU-sm8650-common once the board needs GPU power votes."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Board configuration, component selection, defconfig and patch order described in this section"

[[area.evidence]]
kind = "source"
reference = "feeds.toml"
result = "SoC source URL and reviewed commit pinning the SM8550-common revision"

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py", "scripts/collect-device-inputs.sh"]
inputs = ["uefi-nx769j Mu-Silicium platform package for the Pineapple QRD base board.", "Stock firmware DTB carried in the device vendor_boot image.", "UEFI GOP handoff, PSCI SMC interface and the vendor firmware inventory from proprietary-files.txt.", "Android 14 ABL: boot header version 4, 4096-byte pages, kernel base 0x0."]
configuration = ["firmware.config = nx769j; firmware.dsc = Platforms/Nubia/nx769jPkg/nx769j.dsc; firmware.fd = Build/nx769jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "firmware.packages = [{uefi}, {tree}/package, {tree}/drivers/DarwinBoot, {edk2}].", "firmware.defines.DEVICE_MODEL = nx769j.", "[bootimg.image] base = 0x0, pagesize = 4096, header_version = 4 to match BOARD_KERNEL_BASE, BOARD_KERNEL_PAGESIZE and BOARD_BOOTIMG_HEADER_VERSION."]
procedure = ["Read https://unixnu.com/porting/uefi-firmware and create the uefi-nx769j platform package.", "Include UniXNU, UniXNUPkg, DarwinBoot and, for a Mu-Silicium initrd, UniXNURamDiskDxe, DiskIoDxe and FAT support in the DSC and FDF.", "Include the firmware log exporter from https://unixnu.com/porting/log-capture#firmware-setup so logs can be scanned from the menu during bring-up.", "Run ./unixnu build firmware -D ../UniXNU-NX769J --uefi ../uefi-nx769j and record the firmware commit, output FD and handoff memory map.", "Run ./unixnu bootimg with the firmware DTB and inspect the payload report."]
findings = ["The firmware DTB is a separate input to boot-image assembly; XNU consumes the ADT generated from the board DTS.", "NX769J boots through UEFI: the board configuration sets TARGET_USES_UEFI := true and the boot image is header version 4, so the ABL rejects a version 0 image.", "The stock bootloader keeps a contiguous-splash region whose address is board specific. sheng declares it as /reserved-memory/splash_region and re-adds it through a [[bootimg.dtb_node]] entry; this board has no sourced address yet, so no entry is declared."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The uefi-nx769j platform package does not exist yet; board.toml records its intended DSC and FD paths.", "The firmware DTB and the splash reservation are not collected: both need the device or its vendor_boot image."]
next_action = ["Create the uefi-nx769j package from the Mu-Silicium template and reach the UniXNU menu with a published framebuffer.", "Run sh scripts/collect-device-inputs.sh and record the firmware DTB and splash reservation."]
evidence = []

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["SM8650 CPU topology from mainline sm8650.dtsi: cpu0-1 arm,cortex-a520, cpu2-6 arm,cortex-a720, cpu7 arm,cortex-x4.", "MPIDR affinities 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x600, 0x700.", "GICv3 distributor 0x17100000/0x10000, redistributors 0x17180000/0x200000 with #redistributor-regions = 1 and redistributor-stride 0x40000, ITS at 0x17140000/0x40000.", "19.2 MHz timer. PSCI uses SMC. GIC PPI partitions group cpu0-1, cpu2-6 and cpu7."]
configuration = ["dts/nx769j.dts includes sm8550.dtsi and replaces each cpuN compatible with the SM8650 core name, keeping the DTSI MPIDR values.", "unixnu,cluster-type = E on cpu0-1 and P on cpu2-7 feeds the ADT scheduler grouping.", "CONFIG_XNU_ARMCPU=y and CONFIG_XNU_NATIVE_ARCH_TIMER=y from the ARM64 common fragment."]
procedure = ["Compile the board DTS and inspect enabled CPUs, GIC ranges and timer properties in the generated ADT.", "Record per-CPU entry, timer interrupts and inter-processor interrupt delivery at the checkpoints in https://unixnu.com/porting/bring-up."]
findings = ["The SM8550 DTSI declares three A510 cores followed by A715, A710 and X3 cores. SM8650 instead has two A520 cores first and a single X4 prime core last, so the compatible strings must be replaced per node while the MPIDR layout is unchanged at 0x100 spacing.", "The GIC PPI partitions in sm8650.dtsi confirm the grouping independently of the core names: partition 0 is cpu0-1, partition 1 is cpu2-6 and partition 2 is cpu7.", "CPU affinity values are hardware identifiers; enabled CPU count and MPIDR affinities must be checked together."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["CPU frequency and idle policy are board inputs and are not implemented; no CpuFreq board service exists yet.", "Per-CPU entry and interrupt delivery are not yet observed on this board."]
next_action = ["Record per-CPU entry and interrupt observations once the firmware reaches the kernel handoff."]

[[area.evidence]]
kind = "source"
reference = "dts/nx769j.dts"
result = "SM8650 CPU topology, MPIDR affinities, cluster types and GIC handoff described in this section"

[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["ARM64 Qualcomm DRAM base 0x80000000.", "Handoff window 0x80000000 bytes at 0x80000000, matching payload.dram_size.", "Apps SMMU at 0x15000000/0x100000 and GPU SMMU at 0x03da0000/0x40000, both qcom,sm8650-smmu-500.", "UFS host and PHY register ranges shared with SM8550."]
configuration = ["device_tree.source = device:dts/nx769j.dts; include_dirs = [soc:dts].", "memory@80000000 declares one contiguous DRAM range; payload.adt.owned_memory_size and payload.dram_size are both 0x80000000.", "The reserved-memory node is declared empty: no board reservation is sourced yet."]
procedure = ["Compare firmware RAM ranges, reserved regions, DTS ranges and ADT memory-map entries.", "Check DMA buffers against controller address width, cache policy and SMMU mapping before submitting work.", "Run sh scripts/collect-device-inputs.sh to capture /proc/iomem and the firmware memory map."]
findings = ["The memory node describes the contiguous DRAM range handed to XNU, not the installed RAM. NX769J ships 8 to 24 GiB depending on SKU; 0x80000000 is the handoff window the payload requests and is the value the verified ports on this SoC family use.", "Physical register translation and CPU virtual mappings have different purposes. Preserve physical resource ranges in hardware descriptions.", "The Apps SMMU and GPU SMMU register ranges are identical between SM8550 and SM8650, so the shared SMMU kit is applicable to this board.", "An exported register below 16 MiB is an error: the common generator reads the arm-io window base as the SoC base and requires it to be non-zero."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Board reservations are not declared. The contiguous-splash region and the removed regions come from the firmware memory map and are not in any public NX769J source.", "The installed DRAM size is SKU dependent and is not asserted here; the handoff window is the declared value."]
next_action = ["Run sh scripts/collect-device-inputs.sh and add each reserved region to the reserved-memory node and to a [[bootimg.dtb_node]] entry where the bootloader requires it."]

[[area.evidence]]
kind = "source"
reference = "dts/nx769j.dts"
result = "DRAM handoff window and reserved-memory node state described in this section"

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*"]
inputs = ["UFS host 0x01d84000/0x3000 (qcom,sm8650-ufshc, jedec,ufs-2.0, SPI 265) and UFS PHY 0x01d80000/0x2000 (qcom,sm8650-qmp-ufs-phy).", "GCC AXI, AHB, UniPro, symbol and PHY auxiliary branches; power domains and firmware link state.", "Apps SMMU at 0x15000000, UFS stream assignment, context-bank ownership, DMA width and cache maintenance.", "NX769J is an A/B device with dynamic partitions; userdata is a f2fs volume at /dev/block/bootdevice/by-name/userdata and the super partition is 9126805504 bytes."]
configuration = ["Select ShengUfs, VirtioMmioBlock and VerifiedRoot; CONFIG_XNU_NATIVE_UFS=y and CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y.", "dts/nx769j.dts sets &ufs and &ufsphy status = okay.", "userdata windows are not declared yet: board.toml [userdata] is absent until the live GPT extents are read."]
procedure = ["Read https://unixnu.com/porting/ufs with this storage record.", "Inspect clock enables, power state, HCE/HCS, link state, request-list base and SMMU mappings before changing controller ownership.", "Validate SCSI capacity and GPT reads, then publish the OS and SystemOS windows within the userdata range.", "Run sh scripts/collect-device-inputs.sh for the userdata extents, then add board.toml [userdata] with first_lba, last_lba and lba_bytes.", "Verify persistent Data writes on the documented Data allocation with a recovery image available."]
findings = ["UFS host and PHY addresses are identical between SM8550 and SM8650, and the compatible differs only in the SoC name (qcom,sm8550-ufshc versus qcom,sm8650-ufshc). The shared ShengUfs controller access applies to this board; the board owns its userdata policy.", "An idle AHB branch may report CLK_OFF with hardware gating enabled. Check enable and gating bits together.", "SMMU bypass still has address-width constraints. Validate every DMA range and context-bank assignment.", "recovery.fstab mounts /data as f2fs on userdata, so the persistent Data path must handle f2fs rather than the ext4 layout assumed by some board configurations."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["board.toml [userdata] is absent because first_lba, last_lba and lba_bytes are unfakeable: a wrong range overwrites an unrelated partition.", "payload.adt.root_match_volume_uuid is still REQUIRED_ROOT_VOLUME_UUID and must be read from the installed OS image.", "ShengUfs contains sheng Data and log policy that is board specific and is not reused here."]
next_action = ["Read the userdata GPT extents and add board.toml [userdata] before any image is written to the device.", "Read the OS window APFS volume UUID and set payload.adt.root_match_volume_uuid."]

[[area.evidence]]
kind = "source"
reference = "dts/nx769j.dts"
result = "UFS host and PHY register ranges, node enables and the A/B userdata layout described in this section"

